services:
  db:
    image: postgres:16
    container_name: shepeak-db
    environment:
      POSTGRES_USER: shepeak_owner
      POSTGRES_PASSWORD: dev_only
      POSTGRES_DB: shepeak
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepeak_owner -d shepeak"]
      interval: 2s
      timeout: 3s
      retries: 20
